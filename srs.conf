# 参考配置。docker-compose.yml 里的分发服务改用环境变量配置（./objs/srs -e），不再读这个文件；
# 这里保留等价的文件写法，tools/test_srs_env.sh 用它对比两种配置方式的行为是否一致。
# 如果你坚持用配置文件启动，挂载成 /usr/local/srs/conf/xsx.conf 并用 -c 指定即可。
listen 1935;
max_connections 100;
daemon off;
srs_log_tank console;
srs_log_level warn;
http_api {
    enabled on;
    listen 1985;
    crossdomain on;
}
http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}
vhost __defaultVhost__ {
    tcp_nodelay on;
    min_latency on;
    play { gop_cache off; queue_length 1; mw_latency 100; }
    publish { mr off; }
    http_remux { enabled on; mount /[app]/[stream].flv; }
}
